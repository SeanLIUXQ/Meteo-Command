name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag must equal $expected" }
      - run: python scripts/build_release.py
      - name: Smoke-test extracted executable and persistence
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/*.zip | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'meteo-extracted'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination
          python scripts/smoke_release.py (Join-Path $destination 'Meteo-Command/Meteo-Command.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*.sha256
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; keep its reviewed assets and notes. Build artifacts remain available from this run."
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --draft --verify-tag --title "Meteo-Command $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
